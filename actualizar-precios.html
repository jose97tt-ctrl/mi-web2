<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Actualizar Precios</title>

<style>

body{

    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f4f4;

}

header{

    background:#003b5c;
    color:white;
    padding:20px;
    text-align:center;

}

header h1{

    margin:0;

}

.contenedor{

    max-width:1100px;
    margin:30px auto;
    background:white;
    border-radius:12px;
    padding:25px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);

}

</style>

</head>

<body>

<header>

<h1>

🐟 Panel de Actualización de Precios

</h1>

</header>

<div class="contenedor">

<h2>Panel de precios</h2>

<input
type="text"
id="buscador"
placeholder="🔍 Buscar producto..."
style="
width:100%;
padding:14px;
font-size:18px;
border-radius:10px;
border:1px solid #ccc;
margin-bottom:20px;
box-sizing:border-box;
">

<div id="listaProductos">

</div>
<button
onclick="obtenerPrecios()"
style="
width:100%;
padding:18px;
margin-top:25px;
background:#0a8f4d;
color:white;
font-size:22px;
font-weight:bold;
border:none;
border-radius:10px;
cursor:pointer;
">

💾 Comprobar precios

</button>

</div>

 <script src="productos.js"></script>

<script>

let lista = document.getElementById("listaProductos");

let buscador = document.getElementById("buscador");

function mostrarProductos(){

    lista.innerHTML = "";

    let texto = buscador.value.toLowerCase();

    for(let id in productos){

        if(!productos[id].nombre.toLowerCase().includes(texto)){

            continue;

        }

        lista.innerHTML += `

        <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        padding:15px;
        border-bottom:1px solid #ddd;
        ">

            <span>${productos[id].nombre}</span>

            <input
            type="number"
            data-id="${id}"
            value="${productos[id].precio || ""}"
            step="0.01"
            style="
            width:120px;
            padding:8px;
            font-size:18px;
            text-align:center;
            ">

        </div>

        `;

    }

}

mostrarProductos();

buscador.addEventListener("input", function(){

    mostrarProductos();

});
function obtenerPrecios(){

    let precios = {};

    let cajas = document.querySelectorAll("input[type='number']");

    cajas.forEach(function(caja){

        precios[caja.dataset.id] = parseFloat(caja.value);

    });

    console.log(precios);

}

</script>

</body>

</html>
