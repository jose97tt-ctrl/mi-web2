<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Actualizar Precios</title>

<style>

body{

    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f4f4;

}

header{

    background:#003b5c;
    color:white;
    padding:20px;
    text-align:center;

}

header h1{

    margin:0;

}

.contenedor{

    max-width:1100px;
    margin:30px auto;
    background:white;
    border-radius:12px;
    padding:25px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);

}

</style>

</head>

<body>

<header>

<h1>

🐟 Panel de Actualización de Precios

</h1>

</header>

<div class="contenedor">

<div id="avisoPrecio" style="
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
background:#0a8f4d;
color:white;
padding:14px 26px;
border-radius:10px;
font-size:17px;
font-weight:bold;
box-shadow:0 6px 20px rgba(0,0,0,.25);
z-index:9999;
display:none;
max-width:90%;
text-align:center;
"></div>

<h2>Panel de precios</h2>

<input
type="text"
id="buscador"
placeholder="🔍 Buscar producto..."
style="
width:100%;
padding:14px;
font-size:18px;
border-radius:10px;
border:1px solid #ccc;
margin-bottom:20px;
box-sizing:border-box;
">

<div id="listaProductos">

</div>
<button
onclick="guardarPrecios()"
style="
width:100%;
padding:18px;
margin-top:25px;
background:#0a8f4d;
color:white;
font-size:22px;
font-weight:bold;
border:none;
border-radius:10px;
cursor:pointer;
">

💾 Guardar precios

</button>

<button
onclick="restablecerPrecios()"
style="
width:100%;
padding:14px;
margin-top:12px;
background:#b02a2a;
color:white;
font-size:18px;
font-weight:bold;
border:none;
border-radius:10px;
cursor:pointer;
">

♻️ Restablecer precios originales

</button>

</div>

 <script src="productos.js"></script>
<script src="precios-store.js"></script>

<script>

const lista = document.getElementById("listaProductos");
const buscador = document.getElementById("buscador");

function filaPrecio(id, etiqueta, valor, indice, nombreMostrar){

    const attrIndice = indice === null ? "" : `data-index="${indice}"`;

    return `
        <div style="
        display:grid;
        grid-template-columns:1fr 140px;
        align-items:center;
        gap:20px;
        padding:6px 0;
        ">

            <div style="font-size:15px;">${etiqueta}</div>

            <input
            type="number"
            step="0.01"
            data-id="${id}"
            data-label="${nombreMostrar}"
            ${attrIndice}
            value="${valor != null ? valor : ""}"
            style="
            width:120px;
            padding:10px;
            font-size:18px;
            text-align:center;
            border-radius:8px;
            border:1px solid #ccc;
            ">

        </div>
    `;
}

function mostrarProductos(){

    lista.innerHTML = "";

    const texto = buscador.value.toLowerCase();

    for(const id in productos){

        const producto = productos[id];

        if(!producto.nombre.toLowerCase().includes(texto)){
            continue;
        }

        let filasPrecios = "";

        if(Array.isArray(producto.precios)){

            producto.precios.forEach(function(item, indice){
                filasPrecios += filaPrecio(id, item.nombre, item.precio, indice, item.nombre);
            });

        }else{

            filasPrecios = filaPrecio(id, "Precio (€/kg)", producto.precio, null, producto.nombre);

        }

        lista.innerHTML += `
            <div style="padding:14px;border-bottom:1px solid #e5e5e5;">

                <div style="font-size:12px;color:#888;">${id}</div>

                <div style="font-size:18px;font-weight:bold;margin-bottom:8px;">
                    ${producto.nombre}
                </div>

                ${filasPrecios}

            </div>
        `;
    }
}

function guardarPrecios(){

    const overrides = PreciosStore.cargar();

    const cajas = document.querySelectorAll("#listaProductos input[type='number']");

    cajas.forEach(function(caja){

        const valor = parseFloat(caja.value);
        if(isNaN(valor)) return;

        const id = caja.dataset.id;
        const indice = caja.dataset.index;

        if(!overrides[id]) overrides[id] = {};

        if(indice === undefined){

            overrides[id].precio = valor;

        }else{

            if(!overrides[id].precios) overrides[id].precios = {};
            overrides[id].precios[indice] = valor;

        }
    });

    PreciosStore.guardar(overrides);
    PreciosStore.aplicar(productos, overrides);

    alert("✅ Precios guardados. El catálogo mostrará los nuevos precios.");
}

function restablecerPrecios(){

    if(!confirm("¿Restablecer todos los precios a los valores originales?")){
        return;
    }

    PreciosStore.limpiar();
    location.reload();
}

// Guarda el precio de una sola fila (al pulsar Enter) y avisa.
function guardarUno(input){

    const valor = parseFloat(input.value);
    if(isNaN(valor)) return;

    const id = input.dataset.id;
    const indice = input.dataset.index;
    const nombre = input.dataset.label || id;

    const overrides = PreciosStore.cargar();
    if(!overrides[id]) overrides[id] = {};

    if(indice === undefined){
        overrides[id].precio = valor;
    }else{
        if(!overrides[id].precios) overrides[id].precios = {};
        overrides[id].precios[indice] = valor;
    }

    PreciosStore.guardar(overrides);
    PreciosStore.aplicar(productos, overrides);

    mostrarAviso('El precio de "' + nombre + '" se ha actualizado correctamente');
}

let temporizadorAviso;
function mostrarAviso(mensaje){
    const aviso = document.getElementById("avisoPrecio");
    aviso.textContent = "✅ " + mensaje;
    aviso.style.display = "block";
    clearTimeout(temporizadorAviso);
    temporizadorAviso = setTimeout(function(){
        aviso.style.display = "none";
    }, 2800);
}

// Enter en un campo de precio: aplica ese cambio al momento.
lista.addEventListener("keydown", function(e){
    if(e.key === "Enter" && e.target.matches("input[type='number']")){
        e.preventDefault();
        guardarUno(e.target);
    }
});

buscador.addEventListener("input", mostrarProductos);

mostrarProductos();

</script>

</body>

</html>
