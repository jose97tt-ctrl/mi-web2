<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Actualizar Precios</title>

<style>

body{

    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f4f4;

}

header{

    background:#003b5c;
    color:white;
    padding:20px;
    text-align:center;

}

header h1{

    margin:0;

}

.contenedor{

    max-width:1100px;
    margin:30px auto;
    background:white;
    border-radius:12px;
    padding:25px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);

}

</style>

</head>

<body>

<header>

<h1>

🐟 Panel de Actualización de Precios

</h1>

</header>

<div class="contenedor">

<h2>Panel de precios</h2>

<div id="listaProductos">

</div>

</div>

 <script src="productos.js"></script>

<script>

let lista = document.getElementById("listaProductos");

lista.innerHTML = `

<div style="
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
border-bottom:1px solid #ddd;
">

<span>${productos.aguja.nombre}</span>

<input
type="number"
value="${productos.aguja.precio}"
style="
width:120px;
padding:8px;
font-size:18px;
text-align:center;
">

</div>

`;

</script>

</body>

</html>
