<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Producto</title>

<link rel="stylesheet" href="producto.css">

</head>

<body>
<button class="volver" onclick="history.back()">
← Volver al catálogo
</button>
<div class="contenedorProducto">
<div class="producto">

    <div class="fotoProducto">

        <img id="imagenProducto" src="" alt="">

    </div>

    <div class="infoProducto">

        <h1 id="nombreProducto"></h1>

        <p class="precio" id="precioProducto"></p>

      <p class="descripcion" id="descripcionProducto"></p>

<hr>

<div id="bloqueTamano" style="display:none;">

<h3>📏 Tamaño</h3>

<select id="tamanoProducto" onchange="actualizarPrecio()">

</select>

<hr>

</div>

<h3 id="tituloCantidad">⚖️ Peso</h3>

<select id="peso" onchange="actualizarPrecio()">

<option value="1">1 kg</option>

<option value="2">2 kg</option>

<option value="3">3 kg</option>

<option value="4">4 kg</option>

</select>

<br><br>
<div id="bloquePesoPersonalizado">

<label><b>O escribe el peso exacto:</b></label>

<input
type="number"
id="pesoPersonalizado"
placeholder="Ejemplo: 0.250"
step="0.001"
min="0"
oninput="actualizarPrecio()">
</div>

<hr>

<h3>🔪 Preparación</h3>

<select id="preparacion">

</select>

<p style="color:green;font-weight:bold;">

✅ Disponible

</p>

<h2 id="precioFinal">

Total: 24.00€

</h2>

<button
onclick="agregarProducto()"
class="btn-producto">

🛒 Añadir al pedido

</button>
    </div>

</div>

</div>

<script src="productos.js"></script>
<script src="precios-store.js"></script>

<script>

const parametros = new URLSearchParams(window.location.search);
const idProducto = parametros.get("producto");
const producto = productos[idProducto];

function prepararProducto() {
    if (!producto) {
        document.getElementById("nombreProducto").innerText = "Producto no encontrado";
        document.getElementById("descripcionProducto").innerText = "";
        document.getElementById("imagenProducto").src = "imagenes/logo.png";
        return;
    }

    document.getElementById("nombreProducto").innerText =
    producto.nombre;

    document.getElementById("imagenProducto").src =
    encodeURI("imagenes/" + producto.imagen);

    document.getElementById("imagenProducto").alt =
    producto.nombre;

    if(producto.tipo=="unidad"){

        document.getElementById("precioProducto").innerText =
        producto.precio + " €/unidad";

    }else if(producto.precios){

        document.getElementById("precioProducto").innerText =
        producto.precios[0].precio.toFixed(2) + " €/kg";

    }else{

        document.getElementById("precioProducto").innerText =
        producto.precio + " €/kg";

    }

    document.getElementById("descripcionProducto").innerText =
    producto.descripcion;

    if(producto.precios){

        document.getElementById("bloqueTamano").style.display = "block";

        let selectorTamano =
        document.getElementById("tamanoProducto");

        selectorTamano.innerHTML = "";

        producto.precios.forEach(function(item){

            let opcion = document.createElement("option");

            opcion.value = item.precio;

            opcion.textContent =
            item.nombre + " - " + item.precio.toFixed(2) + " €/kg";

            selectorTamano.appendChild(opcion);

        });

    }else{

        document.getElementById("bloqueTamano").style.display = "none";

    }

    const selectPreparacion = document.getElementById("preparacion");
    selectPreparacion.innerHTML = "";
    if (producto.preparaciones && Array.isArray(producto.preparaciones) && producto.preparaciones.length) {
        producto.preparaciones.forEach(function(preparacion){
            let opcion = document.createElement("option");
            opcion.value = preparacion;
            opcion.textContent = preparacion;
            selectPreparacion.appendChild(opcion);
        });
        selectPreparacion.style.display = "block";
    } else {
        // si no hay preparaciones, dejar una opción por defecto
        let opcion = document.createElement("option");
        opcion.value = "";
        opcion.textContent = "-";
        selectPreparacion.appendChild(opcion);
        selectPreparacion.style.display = "none";
    }

    if(producto.tipo=="unidad"){

        document.querySelector("h3").innerText="🔢 Cantidad";

        document.getElementById("peso").innerHTML="";

        producto.cantidades.forEach(function(cantidad){

            let opcion=document.createElement("option");

            opcion.value=cantidad;

            opcion.textContent=cantidad+" unidades";

            document.getElementById("peso").appendChild(opcion);

        });

        document.getElementById("bloquePesoPersonalizado").style.display="none";

    }

    actualizarPrecio();
}

function actualizarPrecio(){
if(idProducto=="ostra" || idProducto=="vieira"){

    let cantidad =
    parseInt(document.getElementById("peso").value);

    let total = producto.precio * cantidad;

    document.getElementById("precioFinal").innerHTML =
    "Total: " + total.toFixed(2) + " €";

    return;

}

let precioKilo;

if(producto.precios){

    precioKilo =
    parseFloat(document.getElementById("tamanoProducto").value);

}else{

    precioKilo = producto.precio;

}
if(producto.precios){

    document.getElementById("precioProducto").innerText =
    precioKilo.toFixed(2) + " €/kg";

}

let pesoSeleccionado =
parseFloat(document.getElementById("peso").value);

let pesoPersonalizado =
parseFloat(document.getElementById("pesoPersonalizado").value);

let peso;

if(!isNaN(pesoPersonalizado) && pesoPersonalizado > 0){

    peso = pesoPersonalizado;

}else{

    peso = pesoSeleccionado;

}

let total = precioKilo * peso;

document.getElementById("precioFinal").innerHTML =
"Total: " + total.toFixed(2) + " €";

}

window.addEventListener("precios:actualizados", prepararProducto);
window.addEventListener("pageshow", prepararProducto);

document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") {
        prepararProducto();
    }
});

prepararProducto();
function agregarProducto(){
if(producto.tipo=="unidad"){
    let cantidad =
    parseInt(document.getElementById("peso").value);

    let preparacion =
    (document.getElementById("preparacion") && document.getElementById("preparacion").value) || "";

    let precioFinal = producto.precio * cantidad;
    let carrito =
    JSON.parse(localStorage.getItem("carrito")) || [];

    carrito.push({

        nombre: producto.nombre,
        peso: cantidad + " unidades",
        preparacion: preparacion,
        precio: precioFinal

    });

    localStorage.setItem("carrito", JSON.stringify(carrito));

    window.location.href = "index.html#productos";

    return;

}

let pesoSeleccionado =
parseFloat(document.getElementById("peso").value);

let pesoPersonalizado =
parseFloat(document.getElementById("pesoPersonalizado").value);

let peso;

if(!isNaN(pesoPersonalizado) && pesoPersonalizado > 0){

    peso = pesoPersonalizado;

}else{

    peso = pesoSeleccionado;

}

let preparacion =
document.getElementById("preparacion").value;

let nombreProducto = producto.nombre;

let precioKilo;

if(producto.precios){

    let selector = document.getElementById("tamanoProducto");
    let indice = (selector && selector.selectedIndex) || 0;
    if (producto.precios[indice]) {
        nombreProducto = producto.precios[indice].nombre || nombreProducto;
        precioKilo = producto.precios[indice].precio || producto.precio;
    } else {
        precioKilo = producto.precio;
    }

}else{

    precioKilo = producto.precio;

}

let precioFinal = precioKilo * peso;

let carrito =
JSON.parse(localStorage.getItem("carrito")) || [];

carrito.push({

    nombre: nombreProducto,
    peso:peso + " kg",
    preparacion:preparacion,
    precio:precioFinal

});

localStorage.setItem("carrito",JSON.stringify(carrito));

window.location.href="index.html#productos";

}

</script>

</body>

</html>
