select,

width:100%;

padding:14px;

font-size:18px;

margin-top:10px;

margin-bottom:20px;

border-radius:10px;

border:1px solid #ccc;

}

.btnComprar{

width:100%;

padding:18px;

background:#0a8f4d;

border:none;

border-radius:12px;

font-size:22px;

font-weight:bold;

<label><b>O escribe el peso exacto:</b></label>

placeholder="Ejemplo: 0.250"

const parametros = new URLSearchParams(window.location.search);

const idProducto = parametros.get("producto");

const producto = productos[idProducto];

function actualizarPrecio(){
console.log("Funciona");

let precioKilo = producto.precio;

let pesoSeleccionado =
parseFloat(document.getElementById("peso").value);

let pesoPersonalizado =
parseFloat(document.getElementById("pesoPersonalizado").value);

let peso;

if(!isNaN(pesoPersonalizado) && pesoPersonalizado > 0){

    peso = pesoPersonalizado;

}else{

    peso = pesoSeleccionado;

}

let total = precioKilo * peso;

document.getElementById("precioFinal").innerHTML =
"Total: " + total.toFixed(2) + " €";

}
if(producto){

    document.getElementById("nombreProducto").innerText =
    producto.nombre;

    document.getElementById("imagenProducto").src =
    producto.imagen;

    document.getElementById("imagenProducto").alt =
    producto.nombre;

    document.getElementById("precioProducto").innerText =
    producto.precio + " €/kg";

    document.getElementById("descripcionProducto").innerText =
    producto.descripcion;

    const selectPreparacion = document.getElementById("preparacion");

    selectPreparacion.innerHTML = "";

    producto.preparaciones.forEach(function(preparacion){

        let opcion = document.createElement("option");

        opcion.value = preparacion;

        opcion.textContent = preparacion;

        selectPreparacion.appendChild(opcion);

    });

}

actualizarPrecio();
function agregarProducto(){

let pesoSeleccionado =
parseFloat(document.getElementById("peso").value);

let pesoPersonalizado =
parseFloat(document.getElementById("pesoPersonalizado").value);

let peso;

if(!isNaN(pesoPersonalizado) && pesoPersonalizado > 0){

    peso = pesoPersonalizado;

}else{

    peso = pesoSeleccionado;

}

let preparacion =
document.getElementById("preparacion").value;

let precioFinal = producto.precio * peso;

let carrito =
JSON.parse(localStorage.getItem("carrito")) || [];

carrito.push({

    nombre: producto.nombre,
    peso:peso + " kg",
    preparacion:preparacion,
    precio:precioFinal

});

localStorage.setItem("carrito",JSON.stringify(carrito));

window.location.href="index.html#productos";

}
