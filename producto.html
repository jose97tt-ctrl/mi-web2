<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Producto</title>

<style>

body{

margin:0;
padding:0;
font-family:Arial, Helvetica, sans-serif;
background:#f4f4f4;

}
.contenedorProducto{

max-width:1400px;

margin:auto;

padding:40px;

}
.producto{

background:white;

border-radius:20px;

overflow:hidden;

box-shadow:0 10px 30px rgba(0,0,0,.15);

}

.fotoProducto img{

width:100%;

display:block;

}

.infoProducto{

padding:25px;

}

.infoProducto h1{

font-size:42px;

margin-bottom:15px;

color:#003b73;

}

.precio{

font-size:32px;

font-weight:bold;

color:#0a8f4d;

margin-bottom:20px;

}

.descripcion{

font-size:20px;

line-height:1.6;

color:#444;

}

</style>

</head>

<body>
<div class="contenedorProducto">
<div class="producto">

    <div class="fotoProducto">

        <img src="aguja.jpg" alt="Aguja">

    </div>

    <div class="infoProducto">

        <h1>🐟 Aguja</h1>

        <p class="precio">24 €/kg</p>

        <p class="descripcion">
            Pescado azul de gran calidad.
            Ideal para plancha, horno y fritura.
        </p>

    </div>

</div>

</div>

</body>

</html>
