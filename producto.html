<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Producto</title>

<style>

body{

margin:0;
padding:0;
font-family:Arial, Helvetica, sans-serif;
background:#f4f4f4;

}
.contenedorProducto{

max-width:1400px;

margin:auto;

padding:40px;

}
.volver{

background:#0a8f4d;
color:white;

border:none;

padding:12px 22px;

border-radius:10px;

font-size:18px;

font-weight:bold;

cursor:pointer;

margin-bottom:25px;

}
.producto{

background:white;

border-radius:20px;

overflow:hidden;

box-shadow:0 10px 30px rgba(0,0,0,.15);

}

.fotoProducto img{

width:100%;

display:block;

}

.infoProducto{

padding:25px;

}

.infoProducto h1{

font-size:42px;

margin-bottom:15px;

color:#003b73;

}

.precio{

font-size:32px;

font-weight:bold;

color:#0a8f4d;

margin-bottom:20px;

}

.descripcion{

font-size:20px;

line-height:1.6;

color:#444;

}
select,
input{

width:100%;

padding:14px;

font-size:18px;

margin-top:10px;

margin-bottom:20px;

border-radius:10px;

border:1px solid #ccc;

}

.btnComprar{

width:100%;

padding:18px;

background:#0a8f4d;

color:white;

border:none;

border-radius:12px;

font-size:22px;

font-weight:bold;

cursor:pointer;

margin-top:20px;

}

#precioFinal{

color:#0a8f4d;

text-align:center;

font-size:34px;

margin-top:25px;

}


</style>

</head>

<body>
<button class="volver" onclick="history.back()">
← Volver al catálogo
</button>
<div class="contenedorProducto">
<div class="producto">

    <div class="fotoProducto">

        <img id="imagenProducto" src="" alt="">

    </div>

    <div class="infoProducto">

        <h1 id="nombreProducto"></h1>

        <p class="precio" id="precioProducto"></p>

       <p class="descripcion" id="descripcionProducto"></p>
    <hr>

<h3>⚖️ Peso</h3>

<select id="pesoAguja" onchange="actualizarPrecioAguja()">

<option value="1">1 kg</option>

<option value="2">2 kg</option>

<option value="3">3 kg</option>

<option value="4">4 kg</option>

</select>

<br><br>

<label><b>O escribe el peso exacto:</b></label>

<input
type="number"
id="pesoPersonalizadoAguja"
placeholder="Ejemplo: 0.250"
step="0.001"
min="0"
oninput="actualizarPrecioAguja()">

<hr>

<h3>🔪 Preparación</h3>

<select id="preparacionAguja">

<option>Entero</option>

<option>Limpio</option>

<option>Rodajas</option>

</select>

<p style="color:green;font-weight:bold;">

✅ Disponible

</p>

<h2 id="precioFinal">

Total: 24.00€

</h2>

<button class="btnComprar" onclick="agregarAguja()">

🛒 Añadir al pedido

</button>

    </div>

</div>

</div>
<script>

function actualizarPrecioAguja(){
console.log("Funciona");

let precioKilo = 24;

let pesoSeleccionado =
parseFloat(document.getElementById("pesoAguja").value);

let pesoPersonalizado =
parseFloat(document.getElementById("pesoPersonalizadoAguja").value);

let peso;

if(!isNaN(pesoPersonalizado) && pesoPersonalizado > 0){

    peso = pesoPersonalizado;

}else{

    peso = pesoSeleccionado;

}

let total = precioKilo * peso;

document.getElementById("precioFinal").innerHTML =
"Total: " + total.toFixed(2) + " €";

}

actualizarPrecioAguja();
function agregarAguja(){

let pesoSeleccionado =
parseFloat(document.getElementById("pesoAguja").value);

let pesoPersonalizado =
parseFloat(document.getElementById("pesoPersonalizadoAguja").value);

let peso;

if(!isNaN(pesoPersonalizado) && pesoPersonalizado > 0){

    peso = pesoPersonalizado;

}else{

    peso = pesoSeleccionado;

}

let preparacion =
document.getElementById("preparacionAguja").value;

let precioFinal = 24 * peso;

let carrito =
JSON.parse(localStorage.getItem("carrito")) || [];

carrito.push({

    nombre:"Aguja",
    peso:peso + " kg",
    preparacion:preparacion,
    precio:precioFinal

});

localStorage.setItem("carrito",JSON.stringify(carrito));

window.location.href="index.html#productos";

}

</script>

</body>

</html>
